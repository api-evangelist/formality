  x-base-url-note: >-
    The help centre publishes the base as https://app.formality.com/api/v1/{workspaceId}/,
    but app.formality.com does not resolve in DNS (2026-08-17). The live regional
    application hosts named on Formality's own status page are app.eu1.formality.com
    (EU/Ireland) and app.fr1.formality.com (France/Scaleway); both answer
    /api/v1/... with HTTP 401 rather than 404, so the EU host is recorded here and
    the documented generic host is flagged as a provider-side documentation defect.
