aid: formality
name: Formality
description: >-
  Formality is a Paris-based AI platform for end-to-end asset and contract
  intelligence, aimed at businesses that need to centralize, understand, and
  track their legal, administrative, and asset-related documents. The product
  covers the full contract lifecycle: AI-assisted creation and collaborative
  negotiation, electronic signature, then post-signature data extraction,
  deadline and obligation alerts, and natural-language analysis of the resulting
  document estate. Its AI is trained on corporate legal documents, works across
  multiple languages, and runs inside a secure perimeter with full auditability
  and no use of customer data for model training. Formality integrates with
  tools including Google Drive, SharePoint, DocuWare, Docusign, Universign,
  Yousign, HubSpot, Salesforce, Outlook, Teams, Slack, and Gmail, and runs on
  compliant hosting with ISO 27001 and SOC 2 Type II certifications and GDPR
  compliance. It was founded in 2023 and is backed by Partech, Serena, and Bpifrance.
