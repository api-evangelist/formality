x-idempotency-note: >-
  No type:Idempotency pointer is emitted. conventions/formality-conventions.yml records
  idempotency as not supported and not documented: only GET operations are published and
  no idempotency key, write operation or retry-safety rule appears anywhere in
  Formality's documentation. This is a checked absence, not an oversight.
x-mcp-note: >-
  No type:MCPServer pointer is emitted even though Formality's homepage advertises
  "Secure connection via API/MCP" and "+ 130 contract tools for your AI agents". Six
  candidate endpoints were probed and none is an MCP server (see mcp/formality-mcp.yml).
  The marketing claim has no public artifact behind it.
