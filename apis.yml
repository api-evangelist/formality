apis:
- aid: formality-api
  name: Formality API
  description: >-
    The Formality REST API exposes the workspace contract repository so external
    tools and AI agents can retrieve documents and the AI-extracted metadata
    layer. Every path is namespaced to a workspace — /api/v1/{workspaceId}/ —
    and the documented resources cover agreements and agreement fields, with the
    help centre describing coverage of agreements, counterparties and related
    entities. Access uses a two-step bearer flow: an administrator mints a
    long-lived personal Refresh Token in Personal Settings > Formality API, then
    exchanges it at GET /api/v1/token for a 5-minute access token used as
    Authorization: Bearer on subsequent calls. A Swagger UI is published at
    /-/api-doc-swagger but is reachable only after authenticating.
  humanURL: https://help.formality.com/integrations/api
  baseURL: https://app.eu1.formality.com/api/v1/{workspaceId}
  tags:
  - Contract Management
  - Documents
  - Legal
  - Agreements
