  false where the evidence is genuinely absent.
standards:
- id: iso-27001
  conforms: true
  evidence: >-
    'CERTIFICATIONS ISO 27001 & SOC 2 Type II, renewed every year.' — published on the
    Security & sovereignty section of formality.com/en/
  kind: certification
  verified: vendor-published
  note: No certificate number, auditor, scope statement or report is published.
- id: soc2-type2
  conforms: true
  evidence: Same statement as ISO 27001, naming SOC 2 Type II renewed annually.
  kind: certification
  verified: vendor-published
  note: No SOC 2 report or NDA-gated request flow is offered.
- id: gdpr
  conforms: true
  evidence: >-
    Sovereign EU hosting (France via Scaleway, or Ireland), a published privacy policy
    and cookie policy, a dedicated privacy@formality.co contact, cookie consent with a
    13-month maximum retention, and an explicit contractual prohibition on AI providers
    training on customer data.
  kind: regulation
  verified: vendor-published
  sources:
  - https://www.formality.com/en/privacy-policy.html
  - https://www.formality.com/en/cookie-policy.html
- id: eu-data-residency
  conforms: true
  evidence: >-
    'Sovereign: data stored in Europe or in France (Scaleway).' Confirmed structurally
    by two separate regional application hosts, app.fr1.formality.com (France) and
    app.eu1.formality.com (EU/Ireland), both live.
  kind: sovereignty
  verified: probed
- id: rfc9116-security-txt
  conforms: true
  evidence: >-
    https://www.formality.com/.well-known/security.txt returns HTTP 200, text/plain,
    with Contact, Preferred-Languages and a non-expired Expires field (2029-12-31).
  kind: specification
  verified: probed
  note: >-
    Minimal but valid. Missing the recommended Policy, Encryption, Acknowledgments and
    Canonical fields.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    No application/problem+json is documented; the error contract is a four-row status
    table and observed error bodies are 17-byte plain text.
  kind: specification
- id: oauth2
  conforms: false
  evidence: >-
    Authentication is a proprietary two-step bearer exchange (personal refresh token ->
    GET /api/v1/token -> 5-minute access token), not an OAuth 2.0 grant. No
    authorization endpoint, no scopes, no client registration, and
    /.well-known/oauth-authorization-server returns 404.
  kind: specification
- id: oidc
  conforms: partial
  evidence: >-
    End users sign in through Microsoft and Google SSO, which are OIDC providers, and
    an enforce-SSO toggle exists. But Formality itself publishes no
    /.well-known/openid-configuration (404 on auth.eu1.formality.com) and exposes no
    OIDC surface to API consumers, so it is an OIDC relying party for human login only.
  kind: specification
  sources: [https://help.formality.com/setup-permissions/user-management]
- id: hmac-webhook-signing
  conforms: true
  evidence: >-
    Document-access webhook payloads are stated to be signed with HMAC-SHA256.
  kind: practice
  note: The signature header name and replay-protection window are not documented.
- id: asyncapi
  conforms: false
  evidence: >-
    A webhook surface exists (4 document-audit events) but no AsyncAPI document is
    published.
  kind: specification
- id: openapi
  conforms: not-determinable
  evidence: >-
    A Swagger UI is published at /-/api-doc-swagger, which means an OpenAPI/Swagger
    document almost certainly exists internally, but it 302s to the login host and
    /api/v1/openapi.json and /api/v1/swagger.json both return 401. Whether the document
    is OpenAPI 3.x or Swagger 2.0, and whether it is well formed, cannot be determined
    without a customer session.
  kind: specification
- id: rfc8594-sunset-header
  conforms: false
  evidence: No deprecation or sunset policy is published.
  kind: specification
