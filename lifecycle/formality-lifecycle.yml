deprecated_operations: []
notes: >-
  Formality publishes a public Hyperping status page and a v1 URI-versioned API, but
  none of the surrounding lifecycle commitments an integrator needs: no versioning
  policy, no deprecation policy or Sunset headers, no SLA, no changelog and no roadmap.
  For a platform whose own product is contract obligation tracking, the absence of a
  published API change contract is the notable gap.
gaps_worth_raising_with_provider:
- Publish a versioning and deprecation policy for /api/v1.
- Add the API and auth hosts as status-page components.
- Publish a dated changelog.
- Publish an SLA / uptime commitment.
