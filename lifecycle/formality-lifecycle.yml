status_page_note: >-
  The status page monitors the marketing site plus both regional application hosts. It
  does NOT list the API surface, the auth host (auth.eu1.formality.com) or the help
  centre as separate components, so an API consumer cannot distinguish an API incident
  from an application incident. Note the monitored app hosts are the same hosts that
  serve /api/v1/, which is what let this round locate the real API base after the
  documented host (app.formality.com) proved not to resolve.
