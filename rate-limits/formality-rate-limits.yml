de_facto_constraint:
  name: access-token TTL
  value_seconds: 300
  source: https://help.formality.com/integrations/api
  note: >-
    Not a rate limit, but the one published constraint that actually shapes client
    behaviour: the access token minted at GET /api/v1/token lives 5 minutes. Any
    long-running or autonomous client must re-exchange its refresh token roughly every
    5 minutes, which makes the token endpoint the hottest path in any integration —
    and the one most likely to carry an undocumented limit.
