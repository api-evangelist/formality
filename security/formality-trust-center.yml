notes: >-
  Formality publishes a substantive security posture for a company of its size —
  ISO 27001 and SOC 2 Type II claimed and renewed annually, EU/France data residency
  with a named infrastructure partner (Scaleway), AES-256 at rest, TLS 1.3 in transit,
  contractual prohibition on AI vendors training on customer data, full export
  reversibility, and real tenant-level controls (enforced SSO, email-domain
  allowlisting, HMAC-signed document-access webhooks, audit trail).

  The weakness is verifiability rather than substance: everything is self-declared prose
  with no trust portal, no certificate identifiers and no path to the underlying
  reports. Live probing also surfaced a regression the marketing copy does not mention —
  the www origin now serves NO HSTS header, and the registrable domain still has no
  DNSSEC, no CAA records and DMARC at p=none. Those are recorded in
  security/formality-domain-security.yml.
