notes: >-
  ONE real document was found: /.well-known/security.txt. It is served with HTTP 200
  and content-type text/plain from the marketing origin and from every application
  host, so the WellKnown and SecurityTxt pointers in apis.yml are backed by an
  observed document rather than an inferred one.

  A soft-200 trap was ruled out explicitly. The single-page application hosts
  app.eu1.formality.com and app.fr1.formality.com answer HTTP 200 with a 14KB
  text/html Next.js shell for EVERY /.well-known/* path AND for /openapi.json,
  /swagger.json, /graphql and /llms.txt. Those 200s are catch-all SPA responses, not
  documents, and are recorded here as misses. The genuine 404s above were taken from
  auth.eu1.formality.com and api.eu1.formality.com, which return real status codes.

  No OAuth/OIDC discovery metadata is published even though the platform runs
  Google and Microsoft SSO, so authentication/ had to be built from the help centre
  rather than from machine-readable metadata.
